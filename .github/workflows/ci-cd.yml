name: Backend CI/CD

on:
  push:
    branches:
      - develop
      - staging
      - main
  pull_request:
    branches:
      - develop
      - staging
      - main

# Prevent duplicate workflow runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Run unit tests
        run: npm run test

      - name: Build TypeScript output
        run: npm run build

      - name: Create deployment package
        run: |
          echo "Creating deployment package (chatapp.zip)..."
          # Remove old zip if it exists
          rm -f chatapp.zip
          # Create zip excluding large directories and files
          # Include build/* since we build in CI/CD and deploy pre-built artifacts
          # Include package-lock.json for faster npm ci installs during deployment
          zip -r chatapp.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x "*.log" \
            -x "coverage/*" \
            -x ".env*" \
            -x "dump.rdb" \
            -x "*.zip" \
            -x "usr/*" \
            -x ".terraform/*" \
            -x "deployment/.terraform/*" \
            -x "deployment/*.tfstate*" \
            -x "deployment/*.tfvars" \
            -x "deployment/*.pub" \
            -x "deployment/*.rsa" \
            -x "deployment/connect-to-instance.sh" \
            -x "deployment/CONNECTION_INSTRUCTIONS.txt" \
            -x "deployment/verify-codedeploy.sh" \
            -x "deployment/check-deployment-status.sh" \
            -x "deployment/create-deployment.sh" \
            -x "*.map" \
            -x ".DS_Store" \
            -x "*.swp" \
            -x "*.swo" \
            -x "*~"
          if [ -f chatapp.zip ]; then
            SIZE=$(ls -lh chatapp.zip | awk '{print $5}')
            echo "✓ Created chatapp.zip ($SIZE)"
          else
            echo "✗ Failed to create chatapp.zip"
            exit 1
          fi

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatapp-${{ github.sha }}
          path: chatapp.zip
          compression-level: 0

  deploy_develop:
    name: Deploy to Develop
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: develop
    if: github.ref == 'refs/heads/develop'
    outputs:
      bundle_key: ${{ steps.bundle.outputs.bundle_key }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: chatapp-${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload bundle to S3
        id: bundle
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          BUNDLE_KEY="artifacts/develop/chatapp-${GITHUB_SHA}.zip"
          echo "bundle_key=$BUNDLE_KEY" >> "$GITHUB_OUTPUT"
          aws s3 cp chatapp.zip "s3://${S3_BUCKET}/${BUNDLE_KEY}"

      - name: Stop in-progress deployments and wait for completion
        env:
          CODEDEPLOY_APP: ${{ secrets.CODEDEPLOY_APP }}
          CODEDEPLOY_GROUP: ${{ secrets.CODEDEPLOY_GROUP }}
        run: |
          echo "Checking for in-progress deployments..."
          IN_PROGRESS=$(aws deploy list-deployments \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --include-only-statuses Created Queued InProgress Ready \
            --max-items 10 \
            --query 'deployments' \
            --output text || echo "None")

          if [ -n "$IN_PROGRESS" ] && [ "$IN_PROGRESS" != "None" ]; then
            echo "Found in-progress deployments, stopping them..."
            for deployment_id in $IN_PROGRESS; do
              echo "Stopping deployment: $deployment_id"
              aws deploy stop-deployment \
                --deployment-id "$deployment_id" \
                --auto-rollback-enabled || echo "Warning: Could not stop $deployment_id"
            done
            echo "Waiting 10 seconds for deployments to stop and clean up..."
            sleep 10
            
            # Verify no deployments are still in progress
            REMAINING=$(aws deploy list-deployments \
              --application-name "$CODEDEPLOY_APP" \
              --deployment-group-name "$CODEDEPLOY_GROUP" \
              --include-only-statuses Created Queued InProgress Ready \
              --max-items 1 \
              --query 'deployments[0]' \
              --output text || echo "None")
            
            if [ -n "$REMAINING" ] && [ "$REMAINING" != "None" ]; then
              echo "⚠ Warning: Deployment $REMAINING still in progress, waiting additional 10 seconds..."
              sleep 10
            fi
          else
            echo "No in-progress deployments found"
          fi
          
          # Additional check: Make sure we're not creating a duplicate deployment
          echo "Checking for very recent successful deployments (within last 2 minutes)..."
          RECENT_SUCCESS=$(aws deploy list-deployments \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --include-only-statuses Succeeded \
            --max-items 1 \
            --query 'deployments[0]' \
            --output text || echo "None")
          
          if [ -n "$RECENT_SUCCESS" ] && [ "$RECENT_SUCCESS" != "None" ]; then
            DEPLOYMENT_TIME=$(aws deploy get-deployment \
              --deployment-id "$RECENT_SUCCESS" \
              --query 'deploymentInfo.completeTime' \
              --output text || echo "")
            
            if [ -n "$DEPLOYMENT_TIME" ]; then
              echo "Most recent successful deployment: $RECENT_SUCCESS completed at $DEPLOYMENT_TIME"
              echo "Proceeding with new deployment..."
            fi
          fi

      - name: Ensure deployment group uses IN_PLACE strategy
        env:
          CODEDEPLOY_APP: ${{ secrets.CODEDEPLOY_APP }}
          CODEDEPLOY_GROUP: ${{ secrets.CODEDEPLOY_GROUP }}
        run: |
          echo "Checking deployment group configuration..."
          CURRENT_CONFIG=$(aws deploy get-deployment-group \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --query 'deploymentGroupInfo.{ServiceRole:serviceRoleArn,ASGs:autoScalingGroups[*].name,DeploymentType:deploymentStyle.deploymentType,DeploymentOption:deploymentStyle.deploymentOption}' \
            --output json)

          DEPLOYMENT_TYPE=$(echo "$CURRENT_CONFIG" | jq -r '.DeploymentType // "BLUE_GREEN"')
          SERVICE_ROLE=$(echo "$CURRENT_CONFIG" | jq -r '.ServiceRole')
          ASG_NAMES=$(echo "$CURRENT_CONFIG" | jq -r '.ASGs[]' | tr '\n' ' ')

          echo "Current deployment type: $DEPLOYMENT_TYPE"

          if [ "$DEPLOYMENT_TYPE" != "IN_PLACE" ]; then
            echo "Updating deployment group to use IN_PLACE deployment..."
            aws deploy update-deployment-group \
              --application-name "$CODEDEPLOY_APP" \
              --current-deployment-group-name "$CODEDEPLOY_GROUP" \
              --deployment-config-name "CodeDeployDefault.AllAtOnce" \
              --deployment-style deploymentType=IN_PLACE,deploymentOption=WITHOUT_TRAFFIC_CONTROL \
              --service-role-arn "$SERVICE_ROLE" \
              --auto-scaling-groups $ASG_NAMES || echo "Warning: Could not update deployment group (may need manual Terraform apply)"
            echo "Deployment group updated to IN_PLACE"
          else
            echo "Deployment group already configured for IN_PLACE"
          fi

      - name: Verify instances are available for deployment
        env:
          CODEDEPLOY_APP: ${{ secrets.CODEDEPLOY_APP }}
          CODEDEPLOY_GROUP: ${{ secrets.CODEDEPLOY_GROUP }}
        run: |
          echo "Checking if instances are available for deployment..."

          # Get ASG names from deployment group
          DEPLOYMENT_GROUP_CONFIG=$(aws deploy get-deployment-group \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --output json)

          ASG_NAMES=$(echo "$DEPLOYMENT_GROUP_CONFIG" | jq -r '.deploymentGroupInfo.autoScalingGroups[]?.name // empty')

          if [ -z "$ASG_NAMES" ]; then
            echo "❌ ERROR: No Auto Scaling groups configured in deployment group"
            echo "Fix by running: cd deployment && ./fix-deployment-group.sh"
            exit 1
          fi

          echo "Found ASG(s): $ASG_NAMES"

          # Check each ASG for instances
          INSTANCES_FOUND=false
          for ASG_NAME in $ASG_NAMES; do
            echo "Checking ASG: $ASG_NAME"

            # Get instances in InService state
            IN_SERVICE_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
              --output text 2>/dev/null || echo "")
            
            # Also check for Pending:Wait instances that are Healthy (they're ready for deployment, just waiting for ELB health checks)
            PENDING_HEALTHY_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`Pending:Wait` && HealthStatus==`Healthy`].InstanceId' \
              --output text 2>/dev/null || echo "")

            if [ -n "$IN_SERVICE_INSTANCES" ] && [ "$IN_SERVICE_INSTANCES" != "None" ]; then
              echo "✓ Found instances in 'InService' state: $IN_SERVICE_INSTANCES"
              INSTANCES_FOUND=true
            elif [ -n "$PENDING_HEALTHY_INSTANCES" ] && [ "$PENDING_HEALTHY_INSTANCES" != "None" ]; then
              echo "✓ Found healthy instances in 'Pending:Wait' state (ready for deployment): $PENDING_HEALTHY_INSTANCES"
              INSTANCES_FOUND=true
            else
              # Get all instances to show their state
              ALL_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "$ASG_NAME" \
                --query 'AutoScalingGroups[0].Instances[*].{Id:InstanceId,State:LifecycleState,Health:HealthStatus}' \
                --output json 2>/dev/null || echo "[]")

              TOTAL_COUNT=$(echo "$ALL_INSTANCES" | jq 'length')

              if [ "$TOTAL_COUNT" -eq 0 ]; then
                echo "❌ No instances in ASG $ASG_NAME"
                echo "ASG may need to scale up. Check desired capacity:"
                echo "  aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names $ASG_NAME"
              else
                echo "⚠ Found $TOTAL_COUNT instance(s) but none in 'InService' or 'Pending:Wait (Healthy)' state:"
                echo "$ALL_INSTANCES" | jq -r '.[] | "  - \(.Id): \(.State) (Health: \(.Health))"'
              fi
            fi
          done

          if [ "$INSTANCES_FOUND" = false ]; then
            echo ""
            echo "❌ ERROR: No instances available for deployment"
            echo ""
            echo "Possible fixes:"
            echo "  1. Wait for instances to become healthy"
            echo "  2. Check ASG desired capacity:"
            echo "     aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names $ASG_NAMES"
            echo "  3. Manually set desired capacity if needed:"
            echo "     aws autoscaling set-desired-capacity --auto-scaling-group-name <ASG_NAME> --desired-capacity 1"
            echo "  4. Check instance health and logs"
            exit 1
          fi

          echo "✓ Instances are available for deployment"

      - name: Create CodeDeploy deployment
        id: deploy
        env:
          CODEDEPLOY_APP: ${{ secrets.CODEDEPLOY_APP }}
          CODEDEPLOY_GROUP: ${{ secrets.CODEDEPLOY_GROUP }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Check if a deployment was just created (within last 30 seconds) to avoid duplicates
          echo "Checking for very recent deployments to avoid duplicates..."
          RECENT_DEPLOY=$(aws deploy list-deployments \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --include-only-statuses Created Queued InProgress \
            --max-items 1 \
            --query 'deployments[0]' \
            --output text || echo "None")
          
          if [ -n "$RECENT_DEPLOY" ] && [ "$RECENT_DEPLOY" != "None" ]; then
            echo "⚠ Found recent deployment $RECENT_DEPLOY in progress"
            echo "Checking creation time..."
            CREATE_TIME=$(aws deploy get-deployment \
              --deployment-id "$RECENT_DEPLOY" \
              --query 'deploymentInfo.createTime' \
              --output text || echo "")
            
            if [ -n "$CREATE_TIME" ]; then
              echo "Recent deployment created at: $CREATE_TIME"
              echo "Waiting 5 seconds and re-checking..."
              sleep 5
              
              # Check again
              STILL_ACTIVE=$(aws deploy list-deployments \
                --application-name "$CODEDEPLOY_APP" \
                --deployment-group-name "$CODEDEPLOY_GROUP" \
                --include-only-statuses Created Queued InProgress \
                --max-items 1 \
                --query 'deployments[0]' \
                --output text || echo "None")
              
              if [ -n "$STILL_ACTIVE" ] && [ "$STILL_ACTIVE" != "None" ]; then
                echo "⚠ Another deployment is still active: $STILL_ACTIVE"
                echo "This workflow run may be a duplicate. Skipping deployment creation."
                echo "deployment_id=$STILL_ACTIVE" >> "$GITHUB_OUTPUT"
                echo "Using existing deployment: $STILL_ACTIVE"
                exit 0
              fi
            fi
          fi
          
          echo "Creating new deployment..."
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --deployment-config-name "CodeDeployDefault.AllAtOnce" \
            --s3-location bucket="$S3_BUCKET",bundleType=zip,key="${{ steps.bundle.outputs.bundle_key }}" \
            --file-exists-behavior OVERWRITE \
            --query "deploymentId" \
            --output text)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Triggered deployment ${DEPLOYMENT_ID}"

  deploy_staging:
    name: Deploy to Staging
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: staging
    if: github.ref == 'refs/heads/staging'
    outputs:
      bundle_key: ${{ steps.bundle.outputs.bundle_key }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: chatapp-${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload bundle to S3
        id: bundle
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          BUNDLE_KEY="artifacts/staging/chatapp-${GITHUB_SHA}.zip"
          echo "bundle_key=$BUNDLE_KEY" >> "$GITHUB_OUTPUT"
          aws s3 cp chatapp.zip "s3://${S3_BUCKET}/${BUNDLE_KEY}"

      - name: Ensure deployment group uses IN_PLACE strategy
        env:
          CODEDEPLOY_APP: ${{ secrets.CODEDEPLOY_APP }}
          CODEDEPLOY_GROUP: ${{ secrets.CODEDEPLOY_GROUP }}
        run: |
          echo "Checking deployment group configuration..."
          CURRENT_CONFIG=$(aws deploy get-deployment-group \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --query 'deploymentGroupInfo.{ServiceRole:serviceRoleArn,ASGs:autoScalingGroups[*].name,DeploymentType:deploymentStyle.deploymentType,DeploymentOption:deploymentStyle.deploymentOption}' \
            --output json)

          DEPLOYMENT_TYPE=$(echo "$CURRENT_CONFIG" | jq -r '.DeploymentType // "BLUE_GREEN"')
          SERVICE_ROLE=$(echo "$CURRENT_CONFIG" | jq -r '.ServiceRole')
          ASG_NAMES=$(echo "$CURRENT_CONFIG" | jq -r '.ASGs[]' | tr '\n' ' ')

          echo "Current deployment type: $DEPLOYMENT_TYPE"

          if [ "$DEPLOYMENT_TYPE" != "IN_PLACE" ]; then
            echo "Updating deployment group to use IN_PLACE deployment..."
            aws deploy update-deployment-group \
              --application-name "$CODEDEPLOY_APP" \
              --current-deployment-group-name "$CODEDEPLOY_GROUP" \
              --deployment-config-name "CodeDeployDefault.AllAtOnce" \
              --deployment-style deploymentType=IN_PLACE,deploymentOption=WITHOUT_TRAFFIC_CONTROL \
              --service-role-arn "$SERVICE_ROLE" \
              --auto-scaling-groups $ASG_NAMES || echo "Warning: Could not update deployment group (may need manual Terraform apply)"
            echo "Deployment group updated to IN_PLACE"
          else
            echo "Deployment group already configured for IN_PLACE"
          fi

      - name: Verify instances are available for deployment
        env:
          CODEDEPLOY_APP: ${{ secrets.CODEDEPLOY_APP }}
          CODEDEPLOY_GROUP: ${{ secrets.CODEDEPLOY_GROUP }}
        run: |
          echo "Checking if instances are available for deployment..."

          # Get ASG names from deployment group
          DEPLOYMENT_GROUP_CONFIG=$(aws deploy get-deployment-group \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --output json)

          ASG_NAMES=$(echo "$DEPLOYMENT_GROUP_CONFIG" | jq -r '.deploymentGroupInfo.autoScalingGroups[]?.name // empty')

          if [ -z "$ASG_NAMES" ]; then
            echo "❌ ERROR: No Auto Scaling groups configured in deployment group"
            echo "Fix by running: cd deployment && ./fix-deployment-group.sh"
            exit 1
          fi

          echo "Found ASG(s): $ASG_NAMES"

          # Check each ASG for instances
          INSTANCES_FOUND=false
          for ASG_NAME in $ASG_NAMES; do
            echo "Checking ASG: $ASG_NAME"

            # Get instances in InService state
            IN_SERVICE_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
              --output text 2>/dev/null || echo "")
            
            # Also check for Pending:Wait instances that are Healthy (they're ready for deployment, just waiting for ELB health checks)
            PENDING_HEALTHY_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`Pending:Wait` && HealthStatus==`Healthy`].InstanceId' \
              --output text 2>/dev/null || echo "")

            if [ -n "$IN_SERVICE_INSTANCES" ] && [ "$IN_SERVICE_INSTANCES" != "None" ]; then
              echo "✓ Found instances in 'InService' state: $IN_SERVICE_INSTANCES"
              INSTANCES_FOUND=true
            elif [ -n "$PENDING_HEALTHY_INSTANCES" ] && [ "$PENDING_HEALTHY_INSTANCES" != "None" ]; then
              echo "✓ Found healthy instances in 'Pending:Wait' state (ready for deployment): $PENDING_HEALTHY_INSTANCES"
              INSTANCES_FOUND=true
            else
              # Get all instances to show their state
              ALL_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "$ASG_NAME" \
                --query 'AutoScalingGroups[0].Instances[*].{Id:InstanceId,State:LifecycleState,Health:HealthStatus}' \
                --output json 2>/dev/null || echo "[]")

              TOTAL_COUNT=$(echo "$ALL_INSTANCES" | jq 'length')

              if [ "$TOTAL_COUNT" -eq 0 ]; then
                echo "❌ No instances in ASG $ASG_NAME"
                echo "ASG may need to scale up. Check desired capacity:"
                echo "  aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names $ASG_NAME"
              else
                echo "⚠ Found $TOTAL_COUNT instance(s) but none in 'InService' or 'Pending:Wait (Healthy)' state:"
                echo "$ALL_INSTANCES" | jq -r '.[] | "  - \(.Id): \(.State) (Health: \(.Health))"'
              fi
            fi
          done

          if [ "$INSTANCES_FOUND" = false ]; then
            echo ""
            echo "❌ ERROR: No instances available for deployment"
            echo ""
            echo "Possible fixes:"
            echo "  1. Wait for instances to become healthy"
            echo "  2. Check ASG desired capacity:"
            echo "     aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names $ASG_NAMES"
            echo "  3. Manually set desired capacity if needed:"
            echo "     aws autoscaling set-desired-capacity --auto-scaling-group-name <ASG_NAME> --desired-capacity 1"
            echo "  4. Check instance health and logs"
            exit 1
          fi

          echo "✓ Instances are available for deployment"

      - name: Create CodeDeploy deployment
        id: deploy
        env:
          CODEDEPLOY_APP: ${{ secrets.CODEDEPLOY_APP }}
          CODEDEPLOY_GROUP: ${{ secrets.CODEDEPLOY_GROUP }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Check if a deployment was just created (within last 30 seconds) to avoid duplicates
          echo "Checking for very recent deployments to avoid duplicates..."
          RECENT_DEPLOY=$(aws deploy list-deployments \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --include-only-statuses Created Queued InProgress \
            --max-items 1 \
            --query 'deployments[0]' \
            --output text || echo "None")
          
          if [ -n "$RECENT_DEPLOY" ] && [ "$RECENT_DEPLOY" != "None" ]; then
            echo "⚠ Found recent deployment $RECENT_DEPLOY in progress"
            echo "Checking creation time..."
            CREATE_TIME=$(aws deploy get-deployment \
              --deployment-id "$RECENT_DEPLOY" \
              --query 'deploymentInfo.createTime' \
              --output text || echo "")
            
            if [ -n "$CREATE_TIME" ]; then
              echo "Recent deployment created at: $CREATE_TIME"
              echo "Waiting 5 seconds and re-checking..."
              sleep 5
              
              # Check again
              STILL_ACTIVE=$(aws deploy list-deployments \
                --application-name "$CODEDEPLOY_APP" \
                --deployment-group-name "$CODEDEPLOY_GROUP" \
                --include-only-statuses Created Queued InProgress \
                --max-items 1 \
                --query 'deployments[0]' \
                --output text || echo "None")
              
              if [ -n "$STILL_ACTIVE" ] && [ "$STILL_ACTIVE" != "None" ]; then
                echo "⚠ Another deployment is still active: $STILL_ACTIVE"
                echo "This workflow run may be a duplicate. Skipping deployment creation."
                echo "deployment_id=$STILL_ACTIVE" >> "$GITHUB_OUTPUT"
                echo "Using existing deployment: $STILL_ACTIVE"
                exit 0
              fi
            fi
          fi
          
          echo "Creating new deployment..."
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --deployment-config-name "CodeDeployDefault.AllAtOnce" \
            --s3-location bucket="$S3_BUCKET",bundleType=zip,key="${{ steps.bundle.outputs.bundle_key }}" \
            --file-exists-behavior OVERWRITE \
            --query "deploymentId" \
            --output text)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Triggered deployment ${DEPLOYMENT_ID}"

  deploy_production:
    name: Deploy to Production
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
    if: github.ref == 'refs/heads/main'
    outputs:
      bundle_key: ${{ steps.bundle.outputs.bundle_key }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: chatapp-${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload bundle to S3
        id: bundle
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          BUNDLE_KEY="artifacts/production/chatapp-${GITHUB_SHA}.zip"
          echo "bundle_key=$BUNDLE_KEY" >> "$GITHUB_OUTPUT"
          aws s3 cp chatapp.zip "s3://${S3_BUCKET}/${BUNDLE_KEY}"

      - name: Ensure deployment group uses IN_PLACE strategy
        env:
          CODEDEPLOY_APP: ${{ secrets.CODEDEPLOY_APP }}
          CODEDEPLOY_GROUP: ${{ secrets.CODEDEPLOY_GROUP }}
        run: |
          echo "Checking deployment group configuration..."
          CURRENT_CONFIG=$(aws deploy get-deployment-group \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --query 'deploymentGroupInfo.{ServiceRole:serviceRoleArn,ASGs:autoScalingGroups[*].name,DeploymentType:deploymentStyle.deploymentType,DeploymentOption:deploymentStyle.deploymentOption}' \
            --output json)

          DEPLOYMENT_TYPE=$(echo "$CURRENT_CONFIG" | jq -r '.DeploymentType // "BLUE_GREEN"')
          SERVICE_ROLE=$(echo "$CURRENT_CONFIG" | jq -r '.ServiceRole')
          ASG_NAMES=$(echo "$CURRENT_CONFIG" | jq -r '.ASGs[]' | tr '\n' ' ')

          echo "Current deployment type: $DEPLOYMENT_TYPE"

          if [ "$DEPLOYMENT_TYPE" != "IN_PLACE" ]; then
            echo "Updating deployment group to use IN_PLACE deployment..."
            aws deploy update-deployment-group \
              --application-name "$CODEDEPLOY_APP" \
              --current-deployment-group-name "$CODEDEPLOY_GROUP" \
              --deployment-config-name "CodeDeployDefault.AllAtOnce" \
              --deployment-style deploymentType=IN_PLACE,deploymentOption=WITHOUT_TRAFFIC_CONTROL \
              --service-role-arn "$SERVICE_ROLE" \
              --auto-scaling-groups $ASG_NAMES || echo "Warning: Could not update deployment group (may need manual Terraform apply)"
            echo "Deployment group updated to IN_PLACE"
          else
            echo "Deployment group already configured for IN_PLACE"
          fi

      - name: Verify instances are available for deployment
        env:
          CODEDEPLOY_APP: ${{ secrets.CODEDEPLOY_APP }}
          CODEDEPLOY_GROUP: ${{ secrets.CODEDEPLOY_GROUP }}
        run: |
          echo "Checking if instances are available for deployment..."

          # Get ASG names from deployment group
          DEPLOYMENT_GROUP_CONFIG=$(aws deploy get-deployment-group \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --output json)

          ASG_NAMES=$(echo "$DEPLOYMENT_GROUP_CONFIG" | jq -r '.deploymentGroupInfo.autoScalingGroups[]?.name // empty')

          if [ -z "$ASG_NAMES" ]; then
            echo "❌ ERROR: No Auto Scaling groups configured in deployment group"
            echo "Fix by running: cd deployment && ./fix-deployment-group.sh"
            exit 1
          fi

          echo "Found ASG(s): $ASG_NAMES"

          # Check each ASG for instances
          INSTANCES_FOUND=false
          for ASG_NAME in $ASG_NAMES; do
            echo "Checking ASG: $ASG_NAME"

            # Get instances in InService state
            IN_SERVICE_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
              --output text 2>/dev/null || echo "")
            
            # Also check for Pending:Wait instances that are Healthy (they're ready for deployment, just waiting for ELB health checks)
            PENDING_HEALTHY_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`Pending:Wait` && HealthStatus==`Healthy`].InstanceId' \
              --output text 2>/dev/null || echo "")

            if [ -n "$IN_SERVICE_INSTANCES" ] && [ "$IN_SERVICE_INSTANCES" != "None" ]; then
              echo "✓ Found instances in 'InService' state: $IN_SERVICE_INSTANCES"
              INSTANCES_FOUND=true
            elif [ -n "$PENDING_HEALTHY_INSTANCES" ] && [ "$PENDING_HEALTHY_INSTANCES" != "None" ]; then
              echo "✓ Found healthy instances in 'Pending:Wait' state (ready for deployment): $PENDING_HEALTHY_INSTANCES"
              INSTANCES_FOUND=true
            else
              # Get all instances to show their state
              ALL_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "$ASG_NAME" \
                --query 'AutoScalingGroups[0].Instances[*].{Id:InstanceId,State:LifecycleState,Health:HealthStatus}' \
                --output json 2>/dev/null || echo "[]")

              TOTAL_COUNT=$(echo "$ALL_INSTANCES" | jq 'length')

              if [ "$TOTAL_COUNT" -eq 0 ]; then
                echo "❌ No instances in ASG $ASG_NAME"
                echo "ASG may need to scale up. Check desired capacity:"
                echo "  aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names $ASG_NAME"
              else
                echo "⚠ Found $TOTAL_COUNT instance(s) but none in 'InService' or 'Pending:Wait (Healthy)' state:"
                echo "$ALL_INSTANCES" | jq -r '.[] | "  - \(.Id): \(.State) (Health: \(.Health))"'
              fi
            fi
          done

          if [ "$INSTANCES_FOUND" = false ]; then
            echo ""
            echo "❌ ERROR: No instances available for deployment"
            echo ""
            echo "Possible fixes:"
            echo "  1. Wait for instances to become healthy"
            echo "  2. Check ASG desired capacity:"
            echo "     aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names $ASG_NAMES"
            echo "  3. Manually set desired capacity if needed:"
            echo "     aws autoscaling set-desired-capacity --auto-scaling-group-name <ASG_NAME> --desired-capacity 1"
            echo "  4. Check instance health and logs"
            exit 1
          fi

          echo "✓ Instances are available for deployment"

      - name: Create CodeDeploy deployment
        id: deploy
        env:
          CODEDEPLOY_APP: ${{ secrets.CODEDEPLOY_APP }}
          CODEDEPLOY_GROUP: ${{ secrets.CODEDEPLOY_GROUP }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Check if a deployment was just created (within last 30 seconds) to avoid duplicates
          echo "Checking for very recent deployments to avoid duplicates..."
          RECENT_DEPLOY=$(aws deploy list-deployments \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --include-only-statuses Created Queued InProgress \
            --max-items 1 \
            --query 'deployments[0]' \
            --output text || echo "None")
          
          if [ -n "$RECENT_DEPLOY" ] && [ "$RECENT_DEPLOY" != "None" ]; then
            echo "⚠ Found recent deployment $RECENT_DEPLOY in progress"
            echo "Checking creation time..."
            CREATE_TIME=$(aws deploy get-deployment \
              --deployment-id "$RECENT_DEPLOY" \
              --query 'deploymentInfo.createTime' \
              --output text || echo "")
            
            if [ -n "$CREATE_TIME" ]; then
              echo "Recent deployment created at: $CREATE_TIME"
              echo "Waiting 5 seconds and re-checking..."
              sleep 5
              
              # Check again
              STILL_ACTIVE=$(aws deploy list-deployments \
                --application-name "$CODEDEPLOY_APP" \
                --deployment-group-name "$CODEDEPLOY_GROUP" \
                --include-only-statuses Created Queued InProgress \
                --max-items 1 \
                --query 'deployments[0]' \
                --output text || echo "None")
              
              if [ -n "$STILL_ACTIVE" ] && [ "$STILL_ACTIVE" != "None" ]; then
                echo "⚠ Another deployment is still active: $STILL_ACTIVE"
                echo "This workflow run may be a duplicate. Skipping deployment creation."
                echo "deployment_id=$STILL_ACTIVE" >> "$GITHUB_OUTPUT"
                echo "Using existing deployment: $STILL_ACTIVE"
                exit 0
              fi
            fi
          fi
          
          echo "Creating new deployment..."
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --deployment-config-name "CodeDeployDefault.AllAtOnce" \
            --s3-location bucket="$S3_BUCKET",bundleType=zip,key="${{ steps.bundle.outputs.bundle_key }}" \
            --file-exists-behavior OVERWRITE \
            --query "deploymentId" \
            --output text)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Triggered deployment ${DEPLOYMENT_ID}"

  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs:
      - quality
      - deploy_develop
      - deploy_staging
      - deploy_production
    if: always()
    environment:
      name: ${{ github.ref == 'refs/heads/develop' && 'develop' || github.ref == 'refs/heads/staging' && 'staging' || github.ref == 'refs/heads/main' && 'production' || 'notify' }}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Determine deployment status
        id: status
        run: |
          QUALITY_RESULT="${{ needs.quality.result }}"
          TARGET_ENV="none"
          DEPLOY_RESULT="skipped"
          DEPLOYMENT_ID=""
          BUNDLE_KEY=""

          case "${GITHUB_REF}" in
            refs/heads/develop)
              TARGET_ENV="develop"
              DEPLOY_RESULT="${{ needs.deploy_develop.result }}"
              DEPLOYMENT_ID="${{ needs.deploy_develop.outputs.deployment_id }}"
              BUNDLE_KEY="${{ needs.deploy_develop.outputs.bundle_key }}"
              ;;
            refs/heads/staging)
              TARGET_ENV="staging"
              DEPLOY_RESULT="${{ needs.deploy_staging.result }}"
              DEPLOYMENT_ID="${{ needs.deploy_staging.outputs.deployment_id }}"
              BUNDLE_KEY="${{ needs.deploy_staging.outputs.bundle_key }}"
              ;;
            refs/heads/main)
              TARGET_ENV="production"
              DEPLOY_RESULT="${{ needs.deploy_production.result }}"
              DEPLOYMENT_ID="${{ needs.deploy_production.outputs.deployment_id }}"
              BUNDLE_KEY="${{ needs.deploy_production.outputs.bundle_key }}"
              ;;
          esac

          FINAL_STATE="Job Failed. 🔴"
          if [ "$QUALITY_RESULT" = "success" ] && { [ "$DEPLOY_RESULT" = "success" ] || [ "$DEPLOY_RESULT" = "skipped" ]; }; then
            FINAL_STATE="Job Passed. ✅"
          fi

          echo "quality=$QUALITY_RESULT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "deploy=$DEPLOY_RESULT" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "bundle_key=$BUNDLE_KEY" >> "$GITHUB_OUTPUT"
          echo "final_state=$FINAL_STATE" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.final_state }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project*:\n${{ github.event.repository.name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Job*:\n${{ github.workflow }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch*:\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Environment*:\n${{ steps.status.outputs.target }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Quality Gate*:\n${{ steps.status.outputs.quality }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Deploy*:\n${{ steps.status.outputs.deploy }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Deployment Id*:\n${{ steps.status.outputs.deployment_id }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Bundle*:\n${{ steps.status.outputs.bundle_key }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author*:\n${{ github.triggering_actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*When*:\n${{ github.event.head_commit.timestamp }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Job"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

